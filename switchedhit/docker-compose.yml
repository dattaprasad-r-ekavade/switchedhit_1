services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel

  node:
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    command: sh -c "apt-get update && apt-get install -y php-cli php-mbstring php-xml php-zip php-curl && npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - laravel

  adminer:
    image: coleifer/sqlite-web
    ports:
      - "8080:8080"
    volumes:
      - ./database:/database
    command: sqlite_web -H 0.0.0.0 -p 8080 /database/database.sqlite
    networks:
      - laravel

networks:
  laravel:
    driver: bridge